<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вордли">
<title>Вордли — угадай слово</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --tile-empty:#1c2029; --tile-border:#3d434f;
    --correct:#3f9e58; --present:#c2a03a; --absent:#333844;
    --text:#e9edf3; --muted:#8b93a3; --accent:#4f8cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1200px 700px at 50% -10%, #1b2130 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;justify-content:center;
    padding:14px;
    padding-top:calc(74px + env(safe-area-inset-top, 0px));
    min-height:100%;
  }

  .app-header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:100;
    height:calc(56px + env(safe-area-inset-top, 0px));
    padding:0 14px;
    padding-top:env(safe-area-inset-top, 0px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(15,17,21,.8);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    backdrop-filter:blur(14px) saturate(160%);
    border-bottom:1px solid rgba(255,255,255,.06);
    box-shadow:0 6px 24px -18px rgba(0,0,0,.9);
  }

  .brand{
    display:inline-flex;
    align-items:center;
    gap:.26em;
    padding-left:.26em;
    font-size:clamp(17px, 4.8vw, 21px);
    font-weight:800;
    line-height:1;
    text-transform:uppercase;
    user-select:none;
    white-space:nowrap;
    filter:drop-shadow(0 0 6px rgba(79,140,255,.35));
    animation:brandPulse 3.2s ease-in-out infinite;
    /* Небольшая высота — чтобы «разлетающиеся» буквы не резались */
    padding-top:6px;
    padding-bottom:6px;
  }
  @keyframes brandPulse{
    0%,100%{ filter:drop-shadow(0 0 5px rgba(79,140,255,.22)); }
    50%    { filter:drop-shadow(0 0 14px rgba(79,140,255,.6)); }
  }

  .brand-letter{
    display:inline-block;
    background:linear-gradient(90deg,
      #8fa6c9 0%,
      #ffffff 18%,
      #6aa7ff 36%,
      #ffffff 54%,
      #8fa6c9 72%,
      #ffffff 90%,
      #8fa6c9 100%);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    animation:brandShimmer 4.2s linear infinite;
    will-change:transform;
    transform-origin:50% 50%;   /* вращение вокруг центра буквы */
    backface-visibility:hidden;
  }
  @keyframes brandShimmer{
    0%   { background-position:0% center; }
    100% { background-position:200% center; }
  }

  .header-actions{ display:flex; gap:6px; align-items:center; }

  .icon-btn{
    width:38px; height:38px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
    transition:color .15s, background .15s, border-color .15s, transform .1s;
  }
  .icon-btn svg{ width:18px; height:18px; display:block; }
  .icon-btn:hover{
    color:var(--text);
    background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.16);
  }
  .icon-btn:active{ transform:scale(.93); }
  .icon-btn[hidden]{ display:none; }

  .app{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center}

  .screen{display:none;width:100%;flex:1;flex-direction:column;align-items:center;gap:14px;justify-content:center;text-align:center}
  .screen.active{display:flex}
  #screen-game{justify-content:space-between;gap:8px;padding:4px 0}
  #screen-game.active{display:flex}

  h1{font-size:clamp(28px,8vw,38px);letter-spacing:.16em;margin:0;font-weight:800;
     background:linear-gradient(180deg,#fff,#8fa6c9);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{margin:0;font-size:clamp(19px,5.5vw,24px);font-weight:700}
  .sub{color:var(--muted);margin:0;font-size:15px;line-height:1.5;max-width:420px}
  .big-emoji{font-size:56px;line-height:1}

  .btn{
    width:100%;max-width:360px;padding:15px 20px;border-radius:14px;border:1px solid var(--tile-border);
    background:var(--panel);color:var(--text);font-size:16px;font-weight:600;cursor:pointer;
    transition:transform .12s ease, background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover{background:#20242e}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(180deg,#4f8cff,#3a6fd8);border-color:#5f97ff;color:#fff;box-shadow:0 8px 24px -10px #4f8cff}
  .btn.primary:hover{background:linear-gradient(180deg,#5c96ff,#3f76e0)}
  .btn.big{padding:20px;font-size:18px}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .field{width:100%;max-width:360px;display:flex;flex-direction:column;gap:7px;align-items:center}
  .field-label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .seg{display:flex;gap:5px;background:var(--panel);border:1px solid var(--tile-border);border-radius:14px;padding:5px;width:100%}
  .seg button{flex:1;padding:12px 0;border:none;background:transparent;color:var(--muted);
    font-size:17px;font-weight:800;border-radius:10px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px -6px var(--accent)}

  .btn.diff{align-items:flex-start;text-align:left;display:flex;flex-direction:column;gap:3px;padding:13px 18px}
  .btn.diff span{font-size:16px}
  .btn.diff small{color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.3}
  .btn.diff.primary small{color:rgba(255,255,255,.8)}

  .secret-wrap{position:relative;width:100%;max-width:360px}
  #secret-input{
    width:100%;padding:16px 52px 16px 18px;border-radius:14px;border:1px solid var(--tile-border);
    background:var(--panel);color:var(--text);font-size:22px;text-align:center;
    text-transform:uppercase;outline:none;font-weight:700;
  }
  #secret-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
  #toggle-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:8px}

  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px}
  #game-mode{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:left}
  .mini{padding:7px 12px;border-radius:10px;border:1px solid var(--tile-border);background:transparent;
    color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .mini:hover{color:var(--text);border-color:#5a6272}

  .hint-bar{display:none;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
    background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.35);color:#a9c6ff;
    font-size:13px;font-weight:700;letter-spacing:.03em}
  .hint-bar.show{display:flex}
  .hint-bar b{color:#fff;font-size:16px;letter-spacing:.1em}

  .board{--gap:6px;display:grid;gap:var(--gap);margin:0 auto}
  .row{display:grid;gap:var(--gap)}
  .tile{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--tile-border);border-radius:8px;background:var(--tile-empty);
    font-size:calc(var(--cell,40px) * .5);font-weight:800;text-transform:uppercase;user-select:none;
    transition:border-color .12s;overflow:hidden;
  }
  .tile.filled{border-color:#6b7488;animation:pop .12s ease}
  .tile.correct{background:var(--correct);border-color:var(--correct);color:#fff}
  .tile.present{background:var(--present);border-color:var(--present);color:#fff}
  .tile.absent{background:var(--absent);border-color:var(--absent);color:#c8cedb}
  @keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes flipIn{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .tile.flip{animation:flipIn .5s ease forwards}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .row.shake{animation:shake .4s ease}

  .keyboard{display:flex;flex-direction:column;gap:6px;width:100%;max-width:560px;padding:0 2px}
  .krow{display:flex;gap:5px;justify-content:center}
  .key{
    flex:1 1 0;min-width:0;height:clamp(40px,9vw,52px);
    border-radius:11px;border:none;
    background:linear-gradient(180deg,#3a4150,#2a303c);
    color:#e9edf3;
    font-size:clamp(11px,3.4vw,15px);font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s, transform .08s, box-shadow .15s;
    text-transform:uppercase;padding:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 4px rgba(0,0,0,.25);
  }
  .key:hover{background:linear-gradient(180deg,#444b5c,#303747)}
  .key:active{transform:translateY(1px) scale(.97);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
  .key.wide{flex:1.9 1 0;font-size:clamp(10px,2.9vw,12.5px);letter-spacing:.06em}
  .key[data-key="ENTER"]{
    background:linear-gradient(180deg,#4f8cff,#3568d4);
    color:#fff;font-weight:800;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 3px 10px rgba(79,140,255,.4);
  }
  .key[data-key="ENTER"]:hover{background:linear-gradient(180deg,#5c96ff,#3a72e0)}
  .key[data-key="ENTER"]:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
  .key[data-key="BACK"]{background:linear-gradient(180deg,#2c3240,#222732);color:#98a1b3}
  .key[data-key="BACK"]:hover{background:linear-gradient(180deg,#353c4c,#292f3c);color:#cfd5e0}
  .key.correct{background:linear-gradient(180deg,#48ab62,#358a4b);color:#fff}
  .key.present{background:linear-gradient(180deg,#ceac42,#a38430);color:#fff}
  .key.absent{background:linear-gradient(180deg,#22262e,#1a1e25);color:#4d5563;box-shadow:none}

  .toast{
    position:fixed;top:calc(66px + env(safe-area-inset-top, 0px));left:50%;
    transform:translate(-50%,-24px);
    background:#e9edf3;color:#12151c;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:150;white-space:nowrap;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .overlay{position:fixed;inset:0;background:rgba(8,10,14,.82);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:200;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .overlay.show{display:flex;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card{background:var(--panel);border:1px solid var(--tile-border);border-radius:20px;padding:26px 22px;
    width:100%;max-width:370px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;
    animation:rise .25s ease}
  @keyframes rise{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .card .emoji{font-size:48px}
  .card h2{font-size:22px}
  .card p{color:var(--muted);margin:0;font-size:15px;line-height:1.5}
  .card .word{color:var(--accent);font-weight:800;letter-spacing:.18em;word-break:break-all}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand" id="brand" aria-label="ВОРДЛИ"></div>
  <div class="header-actions">
    <button id="btn-share" class="icon-btn" aria-label="Поделиться" title="Поделиться">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>
    <button id="btn-install" class="icon-btn" aria-label="Установить приложение"
            title="Установить приложение" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
  </div>
</header>

<div class="app">

  <section id="screen-menu" class="screen active">
    <div class="big-emoji">🎯</div>
    <h2>Угадайте слово</h2>
    <p class="sub">Зелёный — буква на месте, жёлтый — есть в слове,<br>серый — буквы нет.</p>
    <button class="btn primary big" data-go="friend">🎮 Игра с другом</button>
    <button class="btn big" data-go="bot">🤖 Игра с ботом</button>
  </section>

  <section id="screen-diff" class="screen">
    <h2 id="diff-title">Настройки игры</h2>
    <p class="sub" id="diff-sub"></p>

    <div class="field">
      <div class="field-label">Длина слова</div>
      <div class="seg" id="len-seg">
        <button data-len="4">4</button>
        <button data-len="5" class="on">5</button>
        <button data-len="6">6</button>
        <button data-len="7">7</button>
      </div>
    </div>

    <div class="field"><div class="field-label">Сложность</div></div>
    <button class="btn diff primary" data-diff="easy">
      <span>Легко</span><small id="d-easy"></small>
    </button>
    <button class="btn diff" data-diff="medium">
      <span>Средне</span><small id="d-medium"></small>
    </button>
    <button class="btn diff" data-diff="hard">
      <span>Сложно</span><small id="d-hard"></small>
    </button>

    <button class="btn ghost" data-go="menu">Назад</button>
  </section>

  <section id="screen-setup" class="screen">
    <h2>Игрок 1</h2>
    <p class="sub" id="setup-sub">Загадайте слово. Игрок 2 не должен его видеть!</p>
    <div class="secret-wrap">
      <input id="secret-input" type="password" inputmode="text"
             autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="•••••">
      <button id="toggle-eye" title="Показать/скрыть">👁</button>
    </div>
    <button class="btn primary" id="setup-next" disabled>Дальше</button>
    <button class="btn ghost" data-go="menu">Назад</button>
  </section>

  <section id="screen-handoff" class="screen">
    <div class="big-emoji">🤝</div>
    <h2>Передайте устройство Игроку 2</h2>
    <p class="sub" id="handoff-sub"></p>
    <button class="btn primary" id="handoff-go">Я готов</button>
  </section>

  <section id="screen-game" class="screen">
    <div class="topbar">
      <span id="game-mode">Игра</span>
      <button id="btn-surrender" class="mini">Сдаться</button>
    </div>
    <div class="hint-bar" id="hint-bar"></div>
    <div class="board" id="board"></div>
    <div class="keyboard" id="keyboard"></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="emoji" id="ov-emoji">🎉</div>
    <h2 id="ov-title">Победа!</h2>
    <p id="ov-text"></p>
    <button class="btn primary" id="ov-again">Играть снова</button>
    <button class="btn ghost" id="ov-menu">В меню</button>
  </div>
</div>

<script>
/* ============================================================
   1. СЛОВАРЬ
   ============================================================ */
const WORDS_JSON = {

    БРОД БУРЯ БЫЛЬ ВАЗА ВЕЕР ВЕКО ВЕРА ВЕСЫ ВЕХА ВИЗА ВИНА ВИНО ВОЛК ВОЛЯ ВРАЧ ВРЕД ВЫСЬ
    ГИМН ГЛАЗ ГНЕВ ГОДЫ ГОРА ГОРЕ ГОРН ГОСТ ГРАД ГРАФ ГРИБ ГРИМ ГРОБ ГРОТ ГРУЗ ГУБА ГУСЬ

    ЖАБА ЖАЛО ЖАНР ЖАРА ЖГУТ ЖЕЛЕ ЖЕСТ ЖРЕЦ ЗАРЯ ЗВОН ЗВУК ЗИМА ЗМЕЯ ЗНАК ЗОЛА ЗОНТ ЗУБР

    РЕПА РЕЧЬ РИСК РИТМ РОБА РОЖЬ РОЗА РОЩА РУДА РУКА РУЛЬ РЫБА САЛО САНИ СБОР СВЕТ СЕЛО
    СЕМЯ СЕНО СЕТЬ СИЛА СКАТ СКОТ СЛЕД СЛОН СЛУХ СМЕХ СНЕГ СНОП СОЛО СОЛЬ СОРТ СПОР СРОК
    СТАЖ СТАН СТИХ СТОГ СТОЛ СТОН СТУК СУТЬ СУША СЧЕТ ТАЙМ ТАНК ТЕНЬ ТЕСТ ТИГР ТИРЕ ТОЛК
    ТОРТ ТОСТ ТРУД ТУША ТУШЬ УГАР УГОЛ УДАВ УДОЙ УЖАС УЗЕЛ УКОЛ УЛЕЙ УРОК УТКА ФАКТ ФАРА
    ФАРС ФИЛЕ ФЛАГ ФЛОТ ФОРТ ФОТО ХАОС ХВОЯ ХЛЕБ ХОЛМ ХРАМ ЦАРЬ ЦВЕТ ЦЕНА ЦЕПЬ ЦИКЛ ЧАЩА
    ЧЕЛО ЧУДО ШАРФ ШАТР ШИЛО ШКАФ ШЛЕМ ШТАБ ЩЕЛЬ ЭТАЖ ЭТАП ЭФИР ЮМОР ЯДРО ЯЗЫК ЯЙЦО ЯХТА

  `,
  "5": `

const norm = s => (s || '').toUpperCase().replace(/Ё/g,'Е').replace(/[^А-Я]/g,'');

const ALL_WORDS = [...new Set(
  Object.values(WORDS_JSON).flatMap(raw => raw.trim().split(/\s+/)).map(norm).filter(Boolean)
)].filter(w => w.length >= 4 && w.length <= 7);

const poolOf = len => ALL_WORDS.filter(w => w.length === len);

/* ============================================================
   4. СЛОВАРЬ БЕЗ ПОВТОРОВ
   ============================================================ */
const usedKey = len => 'ru_wordle_used_v4_' + len;
function getUsed(len){
  try { return JSON.parse(localStorage.getItem(usedKey(len)) || '[]'); }
  catch(e){ return []; }
}
function setUsed(len, arr){
  try { localStorage.setItem(usedKey(len), JSON.stringify(arr)); } catch(e){}
}
function pickWord(len){
  const pool = poolOf(len);
  if (!pool.length) return 'СЛОВО';
  let used = getUsed(len).filter(w => pool.includes(w));
  let avail = pool.filter(w => !used.includes(w));
  if (!avail.length){ used = []; avail = pool.slice(); }
  const word = avail[Math.floor(Math.random() * avail.length)];
  used.push(word);
  setUsed(len, used);
  return word;
}

/* ============================================================
   5. ОЦЕНКА
   ============================================================ */
function evaluate(guess, secret){
  const n = secret.length;
  const res = new Array(n).fill('absent');
  const counts = {};
  for (const ch of secret) counts[ch] = (counts[ch] || 0) + 1;
  for (let i = 0; i < n; i++){
    if (guess[i] === secret[i]){ res[i] = 'correct'; counts[guess[i]]--; }
  }
  for (let i = 0; i < n; i++){
    if (res[i] === 'correct') continue;
    const ch = guess[i];
    if (counts[ch] > 0){ res[i] = 'present'; counts[ch]--; }
  }
  return res;
}

function buildBoard(){
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateRows = `repeat(${S.maxTries}, 1fr)`;
  for (let r = 0; r < S.maxTries; r++){
    const row = document.createElement('div');
    row.className = 'row';
    row.style.gridTemplateColumns = `repeat(${S.len}, 1fr)`;
    for (let c = 0; c < S.len; c++){
      const t = document.createElement('div');
      t.className = 'tile';
      row.appendChild(t);
    }
    boardEl.appendChild(row);
  }
  layoutBoard();
}

function layoutBoard(){
  const gap = 6;
  const cols = S.len, rows = S.maxTries;
  const availW = Math.min(window.innerWidth - 32, 520);
  const availH = Math.max(window.innerHeight - 400, 140);
  const cellW = (availW - (cols - 1) * gap) / cols;
  const cellH = (availH - (rows - 1) * gap) / rows;
  const cell  = Math.max(20, Math.min(cellW, cellH, 74));
  boardEl.style.setProperty('--cell', cell + 'px');
  boardEl.style.width = (cols * cell + (cols - 1) * gap) + 'px';
}

window.addEventListener('resize', () => {
  if (screens.game.classList.contains('active')) layoutBoard();
});

function buildKeyboard(){
  keyboardEl.innerHTML = '';
  KB_ROWS.forEach(keys => {
    const kr = document.createElement('div');
    kr.className = 'krow';
    keys.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k === 'ENTER' || k === 'BACK' ? ' wide' : '');
      btn.dataset.key = k;
      btn.textContent = k === 'ENTER' ? 'ВВОД' : (k === 'BACK' ? '⌫' : k);
      btn.addEventListener('click', () => handleKey(k));
      kr.appendChild(btn);
    });
    keyboardEl.appendChild(kr);
  });
}

const rowEl  = i => boardEl.children[i];
const tileEl = (r,c) => boardEl.children[r].children[c];
const keyEl  = k => keyboardEl.querySelector(`[data-key="${k}"]`);

/* ============================================================
   7. ВВОД
   ============================================================ */
function handleKey(k){
  if (S.over || S.busy) return;
  if (k === 'ENTER'){ submitGuess(); return; }
  if (k === 'BACK'){
    if (S.current.length > 0){
      S.current = S.current.slice(0, -1);
      const t = tileEl(S.row, S.current.length);
      t.textContent = '';
      t.classList.remove('filled');
    }
    return;
  }
  if (S.current.length >= S.len) return;
  S.current += k;
  const t = tileEl(S.row, S.current.length - 1);
  t.textContent = k;
  t.classList.add('filled');
}

/* ============================================================
   8. ОТПРАВКА
   ============================================================ */
function submitGuess(){
  if (S.current.length < S.len){
    shakeRow(S.row);
    toast(`Слово должно быть из ${S.len} букв`);
    return;
  }
  const guess = S.current;
  const score = evaluate(guess, S.secret);
  S.busy = true;

  score.forEach((st, i) => {
    const t = tileEl(S.row, i);
    t.classList.add('flip');
    t.style.animationDelay = (i * 0.26) + 's';
    setTimeout(() => t.classList.add(st), i * 260 + 230);
  });

  setTimeout(() => {
    S.guesses.push({ word: guess, score });
    updateKeyboard(guess, score);
    S.busy = false;

    if (guess === S.secret){
      S.over = true;
      setTimeout(() => endGame(true), 180);
      return;
    }
    S.row++;
    S.current = '';
    if (S.row >= S.maxTries){
      S.over = true;
      setTimeout(() => endGame(false), 180);
    }
  }, S.len * 260 + 280);
}

function updateKeyboard(guess, score){
  const rank = { absent: 0, present: 1, correct: 2 };
  score.forEach((st, i) => {
    const el = keyEl(guess[i]);
    if (!el) return;
    const cur = el.classList.contains('correct') ? 'correct'
              : el.classList.contains('present') ? 'present'
              : el.classList.contains('absent')  ? 'absent' : null;
    if (cur && rank[cur] >= rank[st]) return;
    el.classList.remove('correct','present','absent');
    el.classList.add(st);
  });
}

function shakeRow(r){
  const el = rowEl(r);
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 420);
}

function resetGameUI(){
  buildBoard();
  buildKeyboard();
  S.guesses = []; S.current = ''; S.row = 0; S.over = false; S.busy = false;
  overlayEl.classList.remove('show');

  }
}

function startBotGame(){
  S.mode = 'bot';
  S.secret = pickWord(S.len);
  S.maxTries = DIFF[S.diff].tries(S.len);
  resetGameUI();
  $('game-mode').textContent = `🤖 Бот · ${S.len} букв · ${DIFF[S.diff].name}`;
  applyHint();
  showScreen('game');
}

function startFriendGame(secret){
  S.mode = 'friend';
  S.secret = secret;
  S.maxTries = DIFF[S.diff].tries(S.len);
  resetGameUI();
  $('game-mode').textContent = `🎮 Друг · ${S.len} букв · ${DIFF[S.diff].name}`;
  applyHint();
  showScreen('game');
}

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function endGame(won){
  const tries = S.guesses.length;
  $('ov-emoji').textContent = won ? (tries <= 2 ? '🏆' : '🎉') : '😢';
  $('ov-title').textContent = won ? 'Победа!' : 'Не угадали';
  if (won){
    $('ov-text').innerHTML =
      `Слово <span class="word">${S.secret}</span> угадано за ${tries} ${plural(tries,'попытку','попытки','попыток')}.`;
  } else {
    $('ov-text').innerHTML = `Загаданное слово: <span class="word">${S.secret}</span>`;
  }
  overlayEl.classList.add('show');
}

/* ============================================================
   10. НАВИГАЦИЯ
   ============================================================ */
document.querySelectorAll('#len-seg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#len-seg button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    S.len = parseInt(btn.dataset.len, 10);
    refreshDiffText();
  });
});

function refreshDiffText(){
  const len = S.len;
  $('diff-sub').textContent =
    S.mode === 'bot'
      ? `Бот загадает слово из ${len} букв`
      : `Игрок 2 будет угадывать слово из ${len} букв`;
  ['easy','medium','hard'].forEach(k => {
    const d = DIFF[k];
    const t = d.tries(len);
    const extra = d.hint ? ' · первая буква открыта' : '';
    $('d-' + k).textContent = `${t} ${plural(t,'попытка','попытки','попыток')}${extra}`;
  });
}

function openSettings(mode){
  S.mode = mode;
  $('diff-title').textContent = mode === 'bot' ? '🤖 Игра с ботом' : '🎮 Игра с другом';
  refreshDiffText();
  showScreen('diff');
}

document.querySelectorAll('[data-go]').forEach(btn => {
  btn.addEventListener('click', () => {
    const go = btn.dataset.go;
    if (go === 'friend'){ openSettings('friend'); return; }
    if (go === 'bot'){ openSettings('bot'); return; }
    if (go === 'menu'){ showScreen('menu'); }
  });
});

document.querySelectorAll('[data-diff]').forEach(btn => {
  btn.addEventListener('click', () => {
    S.diff = btn.dataset.diff;
    if (S.mode === 'bot'){ startBotGame(); return; }

    secretInput.value = '';
    secretInput.type = 'password';
    secretInput.maxLength = S.len;
    $('toggle-eye').textContent = '👁';
    setupNext.disabled = true;
    $('setup-sub').textContent =
      `Загадайте слово из ${S.len} букв. Игрок 2 не должен его видеть!`;
    showScreen('setup');
    setTimeout(() => secretInput.focus(), 120);
  });
});

setupNext.addEventListener('click', () => {
  const word = norm(secretInput.value);
  if (word.length !== S.len){ toast(`Нужно ровно ${S.len} букв`); return; }
  S.pendingSecret = word;
  secretInput.value = '';
  secretInput.type = 'password';
  $('toggle-eye').textContent = '👁';
  const t = DIFF[S.diff].tries(S.len);
  $('handoff-sub').textContent =
    `Слово загадано. У Игрока 2 есть ${t} ${plural(t,'попытка','попытки','попыток')}, чтобы его отгадать.`;
  showScreen('handoff');
});

$('handoff-go').addEventListener('click', () => {
  startFriendGame(S.pendingSecret || 'СЛОВО');
});

$('toggle-eye').addEventListener('click', () => {
  const hidden = secretInput.type === 'password';
  secretInput.type = hidden ? 'text' : 'password';
  $('toggle-eye').textContent = hidden ? '🙈' : '👁';
  secretInput.focus();
});

secretInput.addEventListener('input', () => {
  const clean = norm(secretInput.value).slice(0, S.len);
  secretInput.value = clean;
  setupNext.disabled = clean.length !== S.len;
});

secretInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && norm(secretInput.value).length === S.len) setupNext.click();
});

$('btn-surrender').addEventListener('click', () => {
  if (S.over) return;
  S.over = true;
  endGame(false);
});

$('ov-again').addEventListener('click', () => {
  overlayEl.classList.remove('show');
  if (S.mode === 'bot'){
    startBotGame();
  } else {
    secretInput.value = '';
    secretInput.type = 'password';
    secretInput.maxLength = S.len;
    $('toggle-eye').textContent = '👁';
    setupNext.disabled = true;
    showScreen('setup');
    setTimeout(() => secretInput.focus(), 120);
  }
});

$('ov-menu').addEventListener('click', () => {
  overlayEl.classList.remove('show');
  showScreen('menu');
});

/* ============================================================
   11. ФИЗИЧЕСКАЯ КЛАВИАТУРА
   ============================================================ */
document.addEventListener('keydown', e => {
  if (!screens.game.classList.contains('active')) return;
  if (overlayEl.classList.contains('show')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === 'Enter'){ e.preventDefault(); handleKey('ENTER'); return; }
  if (e.key === 'Backspace'){ e.preventDefault(); handleKey('BACK'); return; }

  let ch = e.key.toUpperCase().replace('Ё','Е');
  if (/^[А-Я]$/.test(ch)){ e.preventDefault(); handleKey(ch); return; }

  const ru = LAT2RU[e.code];
  if (ru){ e.preventDefault(); handleKey(ru); }
});

/* ============================================================
   12. PWA
   ============================================================ */
(function setupPWA(){
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawIcon(size){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#232c40');
    g.addColorStop(1, '#0f1115');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    ctx.strokeStyle = 'rgba(79,140,255,.65)';
    ctx.lineWidth = Math.max(2, size * 0.018);
    const pad = size * 0.09, rr = size * 0.18;
    roundRect(ctx, pad, pad, size - pad*2, size - pad*2, rr);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${size * 0.46}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('В', size/2, size/2 + size * 0.02);
    return c.toDataURL('image/png');
  }
  const icon192 = drawIcon(192);
  const icon512 = drawIcon(512);

  const manifest = {
    name: 'Вордли — русская версия',
    short_name: 'Вордли',
    description: 'Угадайте слово за ограниченное число попыток',
    lang: 'ru',
    start_url: location.pathname + location.search,
    scope: location.pathname,
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#0f1115',
    theme_color: '#0f1115',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };

  try {
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch(e){}

  const aIcon = document.createElement('link');
  aIcon.rel = 'apple-touch-icon';
  aIcon.href = icon192;
  document.head.appendChild(aIcon);

  const fIcon = document.createElement('link');
  fIcon.rel = 'icon';
  fIcon.type = 'image/png';
  fIcon.href = icon192;
  document.head.appendChild(fIcon);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();

/* ============================================================
   13. КНОПКА «УСТАНОВИТЬ»
   ============================================================ */
(function setupInstallButton(){
  const btnInstall = $('btn-install');
  let deferredPrompt = null;

  const isStandalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (isStandalone()){
    btnInstall.hidden = true;
  } else if (isIOS){
    btnInstall.hidden = false;
  }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone()) btnInstall.hidden = false;
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    btnInstall.hidden = true;
    toast('Приложение установлено 👍');
  });

  btnInstall.addEventListener('click', async () => {
    if (deferredPrompt){
      try {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        if (choice && choice.outcome === 'accepted'){
          deferredPrompt = null;
          btnInstall.hidden = true;
        }
      } catch(e){}
      return;
    }
    if (isIOS){
      alert('Установка на iPhone / iPad:\n\n' +
            '1. Откройте меню «Поделиться» в Safari\n' +
            '2. Прокрутите и выберите «На экран «Домой»»\n' +
            '3. Нажмите «Добавить»');
    } else {
      alert('Установка приложения:\n\n' +
            'В Chrome откройте меню ⋮ (справа сверху) и выберите\n' +
            '«Установить приложение» / «Добавить на главный экран».');
    }
  });
})();

/* ============================================================
   14. КНОПКА «ПОДЕЛИТЬСЯ»
   ============================================================ */
(function setupShareButton(){
  const btnShare = $('btn-share');

  btnShare.addEventListener('click', async () => {
    const url = location.href;
    const payload = {
      title: 'Вордли — русская версия',
      text: 'Угадай слово за несколько попыток!',
      url
    };

    if (navigator.share){
      try {
        await navigator.share(payload);
        return;
      } catch(e){
        if (e && e.name === 'AbortError') return;
      }
    }
    try {
      await navigator.clipboard.writeText(url);
      toast('Ссылка скопирована');
      return;
    } catch(e){}
    try {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('Ссылка скопирована');
    } catch(e){
      prompt('Скопируйте ссылку:', url);
    }
  });
})();

/* ============================================================
   15. АНИМАЦИЯ ЛОГОТИПА «ВОРДЛИ»
   ------------------------------------------------------------
   Сценарий одного «события»:
     1. Все буквы одновременно получают импульс — как будто
        что-то толкнуло их сзади. Мгновенно разлетаются
        каждая в свою сторону, кувыркаясь и увеличиваясь.
     2. Секунду хаотично «висят» в разлёте, продолжая слегка
        дрейфовать и вращаться.
     3. Одновременно все «вспоминают», где должны быть, и
        резко возвращаются на свои места — с перелётом,
        отскоком и лёгкой дрожью в финале.
   ============================================================ */
(function animateBrand(){
  const brandEl = document.getElementById('brand');
  if (!brandEl) return;

  const WORD = 'ВОРДЛИ';
  const letters = [];

  brandEl.textContent = '';
  WORD.split('').forEach(ch => {
    const span = document.createElement('span');
    span.className = 'brand-letter';
    span.textContent = ch;
    brandEl.appendChild(span);
    letters.push(span);
  });

  // Вступительное появление — короткая резкая «выстреливающая» анимация
  letters.forEach((el, i) => {
    el.animate([
      { opacity: 0, transform: 'translate3d(0,-22px,0) scale(.4) rotate(-30deg)' },
      { opacity: 1, transform: 'translate3d(0,5px,0)   scale(1.18) rotate(6deg)', offset: 0.72 },
      { opacity: 1, transform: 'translate3d(0,0,0)    scale(1) rotate(0deg)' }
    ], {
      duration: 500,
      delay: 55 * i,
      easing: 'cubic-bezier(.16,1.25,.3,1)',
      fill: 'both'
    });
  });

  /* ------------------------------------------------------------
     Ключевые кадры «разлёта и возврата».

     Тайминги (доля от общей длительности):
       0.00 — стоим на месте
       0.09 — импульс: буква уже вылетела на 70% пути
       0.28 — замедляется, почти на месте падения
       0.42 — максимальная точка разлёта
       0.58 — хаос: слегка дрейфует, вращаясь
       0.72 — начинает «вспоминать» — сдвиг назад
       0.86 — пролетела мимо своей позиции (перелёт)
       0.94 — отскок в противоположную сторону
       1.00 — успокоилась на месте
     ------------------------------------------------------------ */
  function makeKeyframes(dx, dy, rot, scaleUp){
    return [
      { transform: 'translate3d(0,0,0) rotate(0deg) scale(1)', offset: 0 },

      // 1. Импульс: мгновенный вылет (толчок сзади)
      { transform: `translate3d(${dx*0.70}px, ${dy*0.70}px, 0) rotate(${rot*0.45}deg) scale(${scaleUp})`, offset: 0.09 },

      // 2. Замедление, буква почти долетела
      { transform: `translate3d(${dx*0.94}px, ${dy*0.94}px, 0) rotate(${rot*0.85}deg) scale(${scaleUp*0.96})`, offset: 0.28 },

      // 3. Пик разлёта
      { transform: `translate3d(${dx}px, ${dy}px, 0) rotate(${rot}deg) scale(${scaleUp*0.9})`, offset: 0.42 },

      // 4. Хаос: зависает, слегка дрейфует и доворачивается
      { transform: `translate3d(${dx*1.07}px, ${dy*1.05}px, 0) rotate(${rot*1.18}deg) scale(${scaleUp*0.84})`, offset: 0.58 },

      // 5. «Вспоминает» — начало возврата
      { transform: `translate3d(${dx*0.35}px, ${dy*0.35}px, 0) rotate(${rot*0.5}deg) scale(${scaleUp*0.55})`, offset: 0.72 },

      // 6. Пролетает мимо своей позиции (перелёт)
      { transform: `translate3d(${-dx*0.18}px, ${-dy*0.18}px, 0) rotate(${-rot*0.28}deg) scale(1.16)`, offset: 0.86 },

      // 7. Отскок в противоположную сторону
      { transform: `translate3d(${dx*0.06}px, ${dy*0.06}px, 0) rotate(${rot*0.1}deg) scale(0.94)`, offset: 0.94 },

      // 8. Успокоилась
      { transform: 'translate3d(0,0,0) rotate(0deg) scale(1)', offset: 1 }
    ];
  }

  const DURATION = 1500;             // длительность одного события
  const EASING   = 'cubic-bezier(.32,.02,.4,1)';
  let busy = false;

  function scatterAll(){
    if (busy || document.hidden) return;
    busy = true;

    const center = (letters.length - 1) / 2;

    letters.forEach((el, i) => {
      // Позиция буквы относительно центра слова: -1..+1
      const rel = center === 0 ? 0 : (i - center) / center;

      // «Толчок сзади»: буквы разлетаются преимущественно наружу
      // от центра и вниз (толчок сверху / из-за спины), с шумом.
      const sideStrength = 16 + Math.abs(rel) * 14;           // крайние буквы — сильнее
      const noiseX = (Math.random() - 0.5) * 44;
      const noiseY = (Math.random() - 0.5) * 46;

      let dx = rel * sideStrength + noiseX;
      let dy = 16 + Math.random() * 22 + noiseY * 0.5;        // базово вниз

      // Часть букв случайно выбрасывает вверх — усиливает хаос
      if (Math.random() < 0.35) dy = -Math.abs(dy) * (0.55 + Math.random() * 0.7);

      // Ограничим амплитуду, чтобы не вылетали за шапку
      const maxX = 52, maxY = 34;
      dx = Math.max(-maxX, Math.min(maxX, dx));
      dy = Math.max(-maxY, Math.min(maxY, dy));

      const rot = (Math.random() - 0.5) * 140;
      const scaleUp = 1.15 + Math.random() * 0.22;

      el.animate(makeKeyframes(dx, dy, rot, scaleUp), {
        duration: DURATION,
        easing: EASING,
        fill: 'none'
      });
    });

    setTimeout(() => { busy = false; }, DURATION + 80);
  }

  let timer = null;
  function schedule(){
    clearTimeout(timer);
    // Быстрый темп: 1000–1900 мс между событиями
    const delay = 1000 + Math.random() * 900;
    timer = setTimeout(() => {
      scatterAll();
      schedule();
    }, delay);
  }

  setTimeout(schedule, 1100);

  // Пауза, когда вкладка в фоне
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(timer);
    else schedule();
  });
})();
